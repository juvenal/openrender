name: Deploy Documentation Site

on:
  push:
    branches:
      - master
    paths:
      - 'docs/site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: docs/site

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        working-directory: ${{ github.workspace }}
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        working-directory: ${{ github.workspace }}
        run: sudo snap install dart-sass

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Validate links
        run: ../tools/link-validator.sh public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Admits: a direct push to master, and any workflow_call invocation (the
    # release-tag deploy path from release.yml). Reusable-workflow callees
    # report github.event_name as "workflow_call" (not the caller's original
    # event), so the release path is gated on that rather than on ref/tag
    # matching — release.yml's create-release job already confirmed the tag
    # is on master before calling this workflow. workflow_dispatch from any
    # branch is deliberately excluded to avoid an unguarded manual deploy.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_call'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
