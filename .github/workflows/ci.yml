name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-gcc-release:
    name: linux-gcc-release
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        uses: ./.github/actions/ci
        with:
          compiler: gcc
          build-type: Release
          ctest-mode: release

  linux-clang-release:
    name: linux-clang-release
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Motion replay is byte-exact and Clang contracts multiply-adds differently
      # from the GCC capture.
      CTEST_EXCLUDE_NAMES_EXTRA: Motion_Replay_tessellation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        uses: ./.github/actions/ci
        with:
          compiler: clang
          build-type: Release
          ctest-mode: release

  linux-gcc-debug:
    name: linux-gcc-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        uses: ./.github/actions/ci
        with:
          compiler: gcc
          build-type: Debug
          ctest-mode: debug

  macos-clang-release:
    name: macos-clang-release
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        uses: ./.github/actions/ci
        with:
          compiler: apple-clang
          build-type: Release
          ctest-mode: release

  macos-clang-debug:
    name: macos-clang-debug
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        uses: ./.github/actions/ci
        with:
          compiler: apple-clang
          build-type: Debug
          ctest-mode: debug

  # Required by the release/* ruleset only. Skipped on master so a skipped
  # job is not a required check there. Release builds pass -g so abi-dumper
  # has DWARF, and the LTS label is required to find its tools.
  lts-verify:
    name: lts-verify
    if: >-
      startsWith(github.base_ref, 'release/') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'merge_group' && startsWith(github.event.merge_group.base_ref, 'refs/heads/release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run the LTS suite
        uses: ./.github/actions/ci
        with:
          compiler: gcc
          build-type: Release
          ctest-mode: lts
          extra-cflags: -g
          require-abi-tools: "true"
