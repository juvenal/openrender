name: LTS maintenance

on:
  schedule:
    # Mondays 06:00 UTC, after the nightly window.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  maintain:
    name: maintain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - name: Dispatch CI or flag branches past EOL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/lts_maintenance.py
